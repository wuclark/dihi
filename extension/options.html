<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube ID Server Checker — Options</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 12px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    .row { margin: 12px 0; }
    label { display: block; font-size: 12px; opacity: 0.7; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
    input[type="checkbox"] { width: auto; margin-right: 8px; }
    .check-label { display: flex; align-items: center; gap: 4px; font-size: 14px; opacity: 1; }
    .actions { display: flex; gap: 10px; margin-top: 14px; }
    button { cursor: pointer; padding: 10px 12px; border: 1px solid #ccc; border-radius: 10px; background: #fff; }
    .note { font-size: 12px; opacity: 0.7; margin-top: 10px; }
    .ok { color: #0a7a0a; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Options</h1>

  <div class="card">
    <div class="row">
      <label for="serverOrigin">Server Origin (no trailing slash)</label>
      <input id="serverOrigin" placeholder="https://example.com" />
    </div>

    <div class="row">
      <label for="timeoutMs">Timeout (ms)</label>
      <input id="timeoutMs" type="number" min="500" step="100" />
    </div>

    <div class="row">
      <label for="debounceMs">Debounce (ms)</label>
      <input id="debounceMs" type="number" min="0" step="50" />
    </div>

    <div class="row">
      <label class="check-label" for="autoDownloadEnabled">
        <input id="autoDownloadEnabled" type="checkbox" />
        Auto-download missing videos after repeated visits
      </label>
    </div>

    <div class="row">
      <label for="autoDownloadVisitThreshold">Auto-download visit threshold</label>
      <input id="autoDownloadVisitThreshold" type="number" min="1" step="1" />
    </div>

    <div class="row">
      <label for="playbackMode">Archived playback mode</label>
      <select id="playbackMode">
        <option value="redirect">Preflight redirect (recommended)</option>
        <option value="inpage">Replace YouTube player in place</option>
        <option value="ask">Ask before using the local player</option>
      </select>
    </div>
    <div class="row">
      <label class="check-label" for="playArchivedFromServer">
        <input id="playArchivedFromServer" type="checkbox" />
        Archive preflight: open archived videos from the server instead of YouTube
      </label>
    </div>

    <div class="actions">
      <button id="saveBtn">Save</button>
      <button id="resetBtn">Reset to defaults</button>
      <div id="savedMsg" class="ok" style="display:none; align-self:center;">Saved</div>
    </div>

    <div class="note">
      The extension tracks YouTube video visits locally, checks <code>GET /api/youtube/&lt;id&gt;</code>, and can redirect or replace the YouTube player with local DIHI media. Browser autoplay policy may require clicking Unmute.
    </div>
    <div class="actions">
      <a id="serverLink" href="#" target="_blank" rel="noreferrer">Open dihi server</a>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
