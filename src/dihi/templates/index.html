<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIHI Library</title>
<style>
:root{--bg:#0d0e11;--surface:#14161b;--surface2:#16181d;--border:#23262e;--border2:#2a2e37;--text:#eceef2;--muted:#9aa1ae;--blue:#5aa9ff;--orange:#f0a04b;--green:#5ed68a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'IBM Plex Sans',system-ui,sans-serif}h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif}
.library-main{max-width:1500px;margin:auto;padding:34px 38px 130px}.library-head{display:grid;gap:18px}.library-head h1{font-size:32px;margin:0}.library-sub{color:var(--muted);margin:0}.library-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.library-search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--border2);border-radius:11px;color:var(--text);padding:13px 16px;font:inherit;outline:0}.library-search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #5aa9ff22}.segmented{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}.segmented button,.icon-btn,.artist-chip,.queue-btn,.player-btn{border:0;background:transparent;color:var(--text);cursor:pointer;min-height:42px;padding:9px 13px;font:inherit}.segmented button+button{border-left:1px solid var(--border)}.segmented button.active{background:var(--blue);color:#07111e}.icon-btn{border:1px solid var(--border);border-radius:9px;background:var(--surface);min-width:42px}.icon-btn:hover,.queue-btn:hover,.player-btn:hover,.artist-chip:hover{border-color:var(--blue);color:var(--blue)}.artist-strip{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.artist-chip{white-space:nowrap;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-size:13px}.artist-chip.active{background:var(--blue);color:#07111e;border-color:var(--blue)}.library-tools{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.library-count{color:var(--muted)}
.paste-download{display:flex;gap:8px;align-items:center;max-width:1500px;margin:16px auto 0;padding:0 38px}.paste-download input{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:10px 12px;font:inherit}.paste-download button{border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#07111e;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.paste-download button:disabled{opacity:.6;cursor:wait}.download-message{color:var(--muted);font-size:13px}
.playlist-dialog{background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:14px;padding:22px;max-width:min(460px,calc(100vw - 28px));width:100%;box-shadow:0 20px 60px #000b}.playlist-dialog::backdrop{background:#0009}.playlist-dialog h2{margin:0 0 8px}.playlist-dialog p{color:var(--muted);margin:0 0 16px}.playlist-dialog select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:10px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:12px}.thumb-button{display:block;position:relative;width:100%;aspect-ratio:16/9;padding:0;border:0;background:var(--surface2);color:var(--text);cursor:pointer;overflow:hidden}.thumb-button img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s}.thumb-button:hover img{transform:scale(1.04)}.play-overlay{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;background:#000a;color:#fff;opacity:.86}.thumb-button:hover .play-overlay{background:var(--blue);color:#07111e}.thumb-placeholder{display:grid;place-items:center;height:100%;font-size:30px;color:var(--muted)}.card-body{padding:9px 10px 10px}.card-title{display:-webkit-box;overflow:hidden;font-size:14px;font-weight:650;line-height:1.3;-webkit-box-orient:vertical;-webkit-line-clamp:2}.card-artist{margin-top:4px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.card-meta{margin-top:4px;color:var(--muted);font-size:11px}.card-tags{display:flex;gap:4px;overflow:hidden;margin-top:7px;min-height:21px}.tag-chip{max-width:100px;overflow:hidden;padding:2px 7px;border:1px solid #36506d;border-radius:999px;background:#182536;color:#a9d4ff;font-size:10px;white-space:nowrap;text-overflow:ellipsis}.card-actions{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}.status{font-size:11px}.status.ok{color:var(--green)}.status.warning{color:var(--orange)}.status.fallback{color:var(--blue)}.queue-btn{min-height:28px;padding:3px 6px;border:1px solid var(--border);border-radius:6px;font-size:11px}.list .card{display:grid;grid-template-columns:160px minmax(0,1fr)}.list .thumb-button{height:100%;aspect-ratio:auto}.list .card-body{min-width:0}.load-more{grid-column:1/-1;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);cursor:pointer}.inline-player{margin:0 0 20px;padding:12px;background:var(--surface);border:1px solid var(--border2);border-radius:14px}.inline-player[hidden]{display:none}.inline-player-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.inline-player-title{overflow:hidden;font-weight:650;text-overflow:ellipsis;white-space:nowrap}.inline-player-hint{color:var(--muted);font-size:12px}.inline-player video{display:block;width:min(900px,100%);max-height:62vh;margin:auto;background:#000;border-radius:8px}.inline-player-close{border:1px solid var(--border);border-radius:7px;background:transparent;color:var(--text);cursor:pointer;padding:5px 9px}
.player-bar{position:fixed;z-index:900;left:252px;right:0;bottom:0;background:#101216f5;border-top:1px solid var(--border2);backdrop-filter:blur(16px);padding:10px 18px;display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(260px,2fr) minmax(180px,1fr);gap:14px;align-items:center}.player-track{display:flex;gap:10px;align-items:center;min-width:0}.player-thumb{width:52px;height:36px;object-fit:cover;border-radius:6px;background:var(--surface2)}.player-thumb[hidden]{display:none}.player-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-controls{display:flex;gap:5px;align-items:center;justify-content:center}.player-btn{border:1px solid var(--border);border-radius:8px;min-width:38px;min-height:36px;padding:6px}.player-btn.primary{background:var(--blue);color:#07111e}.seek{width:100%;accent-color:var(--blue)}.player-progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.player-options{display:flex;justify-content:flex-end;gap:6px;align-items:center}.volume{width:80px;accent-color:var(--blue)}.upnext{position:fixed;right:16px;bottom:82px;width:min(360px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:14px;z-index:901;box-shadow:0 12px 40px #0009}.upnext[hidden]{display:none}.upnext-head{display:flex;justify-content:space-between;align-items:center}.upnext-row{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);padding:9px 0}.upnext-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upnext-row button{background:none;border:0;color:var(--muted);cursor:pointer}@media(max-width:900px){.player-bar{left:0;grid-template-columns:1fr auto}.player-controls{grid-column:1/-1;grid-row:2}.player-options{grid-column:2;grid-row:1}.library-main{padding:70px 18px 150px}}@media(max-width:560px){.library-main{padding-left:12px;padding-right:12px}.library-grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.list .card{grid-template-columns:100px minmax(0,1fr)}.list .card-actions{grid-column:2;margin:0}.player-options .volume{display:none}}
</style>
<style>.fullscreen-controls{display:none;justify-content:center;gap:10px;margin-top:12px;opacity:0;pointer-events:none;transition:opacity .2s}.inline-player:fullscreen{display:block;position:relative;min-height:100vh;width:100vw;margin:0;padding:0;background:#000;border:0;border-radius:0}.inline-player:fullscreen .inline-player-head{position:absolute;z-index:2;top:18px;left:24px;right:24px;margin:0;opacity:0;pointer-events:none;transition:opacity .2s}.inline-player:fullscreen.fullscreen-head-visible .inline-player-head{opacity:1;pointer-events:auto}.inline-player:fullscreen .inline-player-hint{display:none}.inline-player:fullscreen video{display:block;width:100vw;height:100vh;max-height:none;margin:0;border-radius:0;object-fit:contain}.inline-player:fullscreen .fullscreen-controls{position:absolute;z-index:2;left:0;right:0;bottom:22px;display:flex;margin:0}.inline-player:fullscreen .fullscreen-controls.visible{opacity:1;pointer-events:auto}.library-select{max-width:220px;background:var(--surface);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:10px 12px;font:inherit}</style>
</head><body class="library-page">
{% include "_header.html" %}
<div class="paste-download" id="paste-download"><input id="download-target" type="text" placeholder="Paste a YouTube URL or ID…" aria-label="YouTube URL or ID"><button type="button" id="download-button">Download</button><span class="download-message" id="download-message" role="status" aria-live="polite"></span></div>
<main class="library-main"><section class="library-head"><div><h1 id="page-title">Library</h1><p class="library-sub" id="library-sub">Loading catalog…</p></div><div class="library-toolbar"><input id="library-search" class="library-search" type="search" placeholder="Search title, artist, or tags…" aria-label="Search library"><div class="segmented" aria-label="Sort"><button data-sort="date-desc" class="active">Newest</button><button data-sort="artist">Artist</button><button data-sort="title">A–Z</button></div><div class="segmented" aria-label="View"><button data-view="grid" class="active">▦</button><button data-view="list">☷</button></div></div><div class="artist-strip" id="artist-strip"></div><div class="library-tools"><span class="library-count" id="library-count"></span><div><button class="icon-btn" id="play-all" type="button" title="Play all">▶ Play all</button><button class="icon-btn" id="shuffle" type="button" title="Shuffle">⇄ Shuffle</button></div></div></section><section id="inline-player" class="inline-player" hidden aria-label="Now playing"><div class="inline-player-head"><div><div id="inline-player-title" class="inline-player-title">Nothing playing</div><div class="inline-player-hint">In-page playback · use the controls below the video</div></div><button id="inline-player-close" class="inline-player-close" type="button">Close player</button></div><video id="player-video" preload="metadata" playsinline controls></video></section><section id="library-grid" class="library-grid" aria-live="polite"></section></main>
<dialog id="playlist-dialog" class="playlist-dialog" aria-labelledby="playlist-dialog-title"><form method="dialog" id="playlist-form"><h2 id="playlist-dialog-title">Add to playlist</h2><p>Choose a saved playlist for this video.</p><label for="playlist-select">Playlist</label><select id="playlist-select" required></select><div class="dialog-actions"><button class="player-btn" value="cancel">Cancel</button><button class="player-btn primary" value="confirm">Add video</button></div></form></dialog>
<aside class="upnext" id="upnext" hidden><div class="upnext-head"><strong>Up next · <span id="upnext-count">0</span></strong><button class="player-btn" id="clear-queue">Clear</button></div><div id="upnext-list"></div></aside>
<footer class="player-bar" aria-label="Persistent player"><div class="player-track"><img id="player-thumb" class="player-thumb" alt=""><div><div id="player-title" class="player-title">Nothing playing</div><div id="player-artist" class="player-artist">Choose a video from the library</div></div></div><div><div class="player-controls"><button class="player-btn" id="previous" aria-label="Previous">⏮</button><button class="player-btn primary" id="play-pause" aria-label="Play">▶</button><button class="player-btn" id="next" aria-label="Next">⏭</button><button class="player-btn" id="audio-only" aria-label="Toggle audio only">♫</button><button class="player-btn" id="expand" aria-label="Open full video">↗</button></div><div class="player-progress"><span id="current-time">0:00</span><input class="seek" id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><span id="total-time">0:00</span></div></div><div class="player-options"><button class="player-btn" id="upnext-toggle">Up next · <span id="upnext-count-2">0</span></button><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volume"><audio id="player-audio" preload="metadata" hidden></audio></div></footer>
</script><script src="{{ url_for('static', filename='js/library.js') }}?v=11"></script></body></html>
