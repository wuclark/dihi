<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIHI Playlists</title>
<style>
  :root { color-scheme:dark; --bg:#0f0f0f; --surface:#1b1b1b; --border:#3b3b3b; --muted:#aaa; --accent:#7cf; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:#eee; font:14px system-ui,sans-serif; }
  main { max-width:1100px; margin:auto; padding:24px; } h1 { margin-top:0; }
  .playlist { border:1px solid var(--border); border-radius:9px; background:var(--surface); margin:14px 0; padding:16px; }
  .playlist.incomplete { border-color:#a66; } .playlist.complete { border-color:#486b4e; } .playlist.empty-playlist { border-color:#88784a; }
  .playlist-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h2 { margin:0; font-size:1.05rem; } a { color:var(--accent); } .muted { color:var(--muted); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; } button, .button { background:#272727; border:1px solid var(--border); border-radius:6px; color:#eee; padding:7px 10px; text-decoration:none; cursor:pointer; }
  .button.primary { color:#000; background:#7cf; border-color:#7cf; } .videos { margin-top:12px; display:grid; gap:5px; max-height:300px; overflow:auto; border-top:1px solid var(--border); padding-top:10px; }
  .video { display:grid; grid-template-columns:44px minmax(0,1fr) 95px auto; gap:8px; align-items:center; } .video a { overflow-wrap:anywhere; }
  .empty { color:var(--muted); padding:20px 0; }
</style>
{% include "_header.html" %}
<main><h1>Saved playlists</h1><p class="muted">Playlists are saved with their names and ordered video members. Downloads start only when you click Download playlist.</p><label class="muted"><input id="hide-autogenerated" type="checkbox" checked> Hide autogenerated YouTube Mixes (<code>RD…</code>)</label><div id="list"><div class="empty">Loading playlists…</div></div></main>
<script>
'use strict';
const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list = document.getElementById('list');
const hideAutogenerated = document.getElementById('hide-autogenerated');
hideAutogenerated.checked = localStorage.getItem('dihi-hide-autogenerated') !== 'false';
hideAutogenerated.addEventListener('change', () => { localStorage.setItem('dihi-hide-autogenerated', hideAutogenerated.checked); load(); });
async function load() {
  try {
    const response = await fetch('/api/media/playlists', {cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const playlists = (await response.json()).playlists || [];
    const visible = hideAutogenerated.checked ? playlists.filter(p => !p.playlist_id.startsWith('RD')) : playlists;
    if (!visible.length) { list.innerHTML = '<div class="empty">No visible playlist metadata found.</div>'; return; }
    list.innerHTML = visible.map(p => { const empty = p.video_count === 0; const complete = !empty && p.missing_count === 0; const snapshot = p.playlist_id.startsWith('SNAP_'); const state = empty ? ' · no members captured' : p.missing_count ? ` · ${p.missing_count} unavailable` : ' · complete'; return `<article class="playlist ${empty ? 'empty-playlist' : complete ? 'complete' : 'incomplete'}" data-id="${esc(p.playlist_id)}"><div class="playlist-head"><div><h2>${esc(p.title)}</h2><div class="muted"><strong>${p.available_count}/${p.video_count}</strong> videos${state}</div></div><div class="actions"><button class="button toggle" type="button">Show videos</button><button class="button refresh" type="button">Refresh playlist</button><button class="button primary finish" type="button">Download playlist</button><a class="button primary" href="/?playlist=${encodeURIComponent(p.playlist_id)}&playall=1&autoplay=1">▶ Play all</a><a class="button" href="/api/media/playlists/${encodeURIComponent(p.playlist_id)}.m3u?mode=video">VLC video</a><a class="button" href="/api/media/playlists/${encodeURIComponent(p.playlist_id)}.m3u?mode=audio">VLC audio only</a>${snapshot ? '<button class="button remove-snapshot" type="button">Remove snapshot</button>' : ''}<a class="button" href="${esc(p.webpage_url)}" target="_blank" rel="noopener">YouTube</a></div></div><div class="videos" hidden><div class="muted">Loading videos…</div></div></article>`; }).join('');
  } catch (error) { list.innerHTML = `<div class="empty">Could not load playlists: ${esc(error.message)}</div>`; }
}
async function loadVideos(article) {
  const id = article.dataset.id;
  const box = article.querySelector('.videos');
  try {
    const data = await (await fetch(`/api/media/playlists/${encodeURIComponent(id)}`, {cache:'no-store'})).json();
    const videos = data.videos || [];
    box.innerHTML = videos.length ? videos.map((item, i) => { const complete = item.video?.files?.video && item.video?.files?.audio; const state = item.video ? (complete ? 'downloaded' : 'incomplete') : 'not local'; return `<div class="video"><span class="muted">${item.playlist_index || i + 1}</span><a href="/video/${encodeURIComponent(item.video_id)}">${esc(item.title || item.video?.title || item.video_id)}</a><span class="muted">${state}</span>${complete ? '<span class="muted">✓</span>' : `<button class="download-video" data-download-video="${esc(item.video_id)}" type="button">Download</button>`}</div>`; }).join('') : '<div class="muted">No indexed videos in this playlist.</div>';
  } catch (error) { box.innerHTML = `<div class="muted">Could not load videos: ${esc(error.message)}</div>`; }
}
list.addEventListener('click', async event => {
  const remove = event.target.closest('.remove-snapshot');
  if (remove) {
    const article = remove.closest('.playlist');
    if (!confirm('Remove this local snapshot? Downloaded media will not be deleted.')) return;
    remove.disabled = true; remove.textContent = 'Removing…';
    try { const response = await fetch(`/api/media/playlists/${encodeURIComponent(article.dataset.id)}`, {method:'DELETE'}); const data = await response.json(); if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`); article.remove(); }
    catch (error) { remove.textContent = `Failed: ${error.message}`; remove.disabled = false; }
    return;
  }
  const refresh = event.target.closest('.refresh');
  if (refresh) {
    const article = refresh.closest('.playlist'); refresh.disabled = true; refresh.textContent = 'Refreshing…';
    try { const response = await fetch(`/api/media/playlists/${encodeURIComponent(article.dataset.id)}/refresh`, {method:'POST'}); const data = await response.json(); if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`); refresh.textContent = data.repaired ? `Repaired ${data.members}` : `Updated ${data.members}`; setTimeout(() => location.reload(), 800); }
    catch (error) { refresh.textContent = `Failed: ${error.message}`; refresh.disabled = false; }
    return;
  }
  const toggle = event.target.closest('.toggle');
  if (toggle) {
    const article = toggle.closest('.playlist');
    const box = article.querySelector('.videos');
    box.hidden = !box.hidden;
    toggle.textContent = box.hidden ? 'Show videos' : 'Hide videos';
    if (!box.hidden && !article.dataset.loaded) { article.dataset.loaded = '1'; await loadVideos(article); }
    return;
  }
  const videoButton = event.target.closest('.download-video');
  if (videoButton) {
    videoButton.disabled = true;
    videoButton.textContent = 'Queuing…';
    try {
      const response = await fetch(`/api/youtube/get/${encodeURIComponent(videoButton.dataset.downloadVideo)}`, {method:'POST'});
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
      videoButton.textContent = data.already_running ? 'Already queued' : 'Queued';
    } catch (error) { videoButton.textContent = `Failed: ${error.message}`; videoButton.disabled = false; }
    return;
  }
  const button = event.target.closest('.finish');
  if (!button) return;
  const article = button.closest('.playlist');
  button.disabled = true;
  button.textContent = 'Checking…';
  try {
    const response = await fetch(`/api/media/playlists/${encodeURIComponent(article.dataset.id)}/finish`, {method:'POST'});
    const data = await response.json();
    if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
    button.textContent = data.already_queued ? 'Already queued' : 'Download started';
  } catch (error) { button.textContent = `Failed: ${error.message}`; button.disabled = false; }
});
load();
</script>
