<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIHI Downloads</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #272727;
  --border: #333;
  --text: #f1f1f1;
  --muted: #aaa;
  --accent: #3ea6ff;
  --green: #2ea043;
  --red: #f85149;
  --yellow: #d29922;
  --radius: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
}
header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); text-decoration: none; }
.hbtn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 10px; border-radius: 6px; font-size: 0.82rem; cursor: pointer;
  text-decoration: none; white-space: nowrap;
}
.hbtn:hover { border-color: var(--accent); }
#summary { margin-left: auto; color: var(--muted); font-size: 0.82rem; }
main { max-width: 1100px; margin: 0 auto; padding: 22px 24px 34px; display: grid; gap: 18px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.15rem; font-weight: 650; }
h2 { font-size: 0.95rem; font-weight: 650; }
.muted { color: var(--muted); font-size: 0.82rem; }
.queue-output {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.queue-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.queue-value { font-size: 1.05rem; font-weight: 700; }
.queue-value.empty { color: var(--green); }
.queue-value.busy { color: var(--yellow); }
.table {
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  background: var(--surface);
}
.row {
  display: grid; grid-template-columns: 92px minmax(140px, 1fr) 122px 120px 150px;
  gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--border);
}
.row:first-child { border-top: 0; }
.head {
  background: var(--surface2); color: var(--muted); font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: .04em; font-weight: 700;
}
.id { font: 0.82rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
.status {
  display: inline-flex; align-items: center; justify-content: center;
  width: fit-content; min-width: 86px; border-radius: 999px; padding: 3px 8px;
  font-size: 0.75rem; font-weight: 700; border: 1px solid var(--border);
}
.downloading { color: #000; background: var(--yellow); border-color: var(--yellow); }
.completed { color: #fff; background: var(--green); border-color: var(--green); }
.failed { color: #fff; background: var(--red); border-color: var(--red); }
.links { display: flex; gap: 8px; flex-wrap: wrap; }
.links a { color: var(--accent); text-decoration: none; font-size: 0.78rem; }
.links a:hover { text-decoration: underline; }
.copy-url { color: var(--accent); background: none; border: 0; cursor: pointer; padding: 0; font-size: .78rem; }
.copy-url:hover { text-decoration: underline; }
.retry-download { color: var(--yellow); background: none; border: 0; cursor: pointer; padding: 0; font-size: .78rem; }
.progress-detail { grid-column: 1 / -1; min-width: 0; }
.progress-bar { height: 7px; background: var(--surface2); border-radius: 5px; overflow: hidden; margin: 5px 0; }
.progress-fill { height: 100%; background: var(--accent); transition: width .3s ease; }
.progress-file { color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
.file-progress-list { display: grid; gap: 4px; margin: 7px 0; }
.file-progress-row { display: grid; grid-template-columns: minmax(120px, 1fr) 58px; gap: 6px; align-items: center; font-size: .72rem; color: var(--muted); }
.file-progress-row .progress-bar { grid-column: 1 / -1; margin: 0; }
.progress-log { margin-top: 5px; max-height: 120px; overflow: auto; color: var(--muted); font: .72rem/1.4 ui-monospace, monospace; white-space: pre-wrap; }
.empty {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
  color: var(--muted); padding: 26px 18px; text-align: center;
}
@media (max-width: 760px) {
  header { padding: 10px 14px; }
  main { padding: 14px; }
  #summary { margin-left: 0; width: 100%; }
  .row { grid-template-columns: 1fr; gap: 6px; }
  .head { display: none; }
  .row { align-items: start; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">DIHI</a>
  <a class="hbtn" href="/">Library</a>
  <a class="hbtn" href="/tags">Tags</a>
  <a class="hbtn" href="/tools">Tools</a>
  <a class="hbtn" href="/status">Status</a>
  <button class="hbtn" type="button" onclick="loadStatus()">Refresh</button>
  <span id="summary">Loading...</span>
</header>

<main>
  <div class="section-head">
    <h1>Downloads</h1>
    <span class="muted" id="updated"></span>
  </div>

  <section class="queue-output" aria-live="polite">
    <div>
      <div class="queue-title">Queue</div>
      <div class="queue-value" id="queue-output">Loading...</div>
    </div>
    <span class="muted" id="queue-detail"></span>
  </section>
  <section class="queue-output"><div><div class="queue-title">System status</div><div class="muted" id="system-status">Checking disk and cookies…</div></div></section>

  <section>
    <div class="section-head">
      <h2>Active</h2>
      <span class="muted" id="active-count"></span>
    </div>
    <div id="active"></div>
  </section>
  <section>
    <div class="section-head"><h2>Failed downloads</h2><span class="muted">Retry or use cookies for age/login failures</span></div>
    <div id="failures"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Recent</h2>
      <span class="muted" id="recent-count"></span>
    </div>
    <div id="recent"></div>
  </section>
</main>

<script>
'use strict';

const $ = id => document.getElementById(id);
let timerId = null;

async function loadStatus() {
  try {
    const r = await fetch('/api/downloads/status', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    render(data);
  } catch (e) {
    $('summary').textContent = `Failed to load downloads: ${e.message}`;
  }
}

function render(data) {
  const counts = data.counts || {};
  const queue = data.queue || {};
  $('summary').textContent = `${counts.active || 0} active, ${counts.recent || 0} recent`;
  $('updated').textContent = `Updated ${new Date().toLocaleTimeString()}`;
  $('queue-output').textContent = queue.empty ? 'Queue Empty' : `${queue.remaining_videos || 0} video${queue.remaining_videos === 1 ? '' : 's'} remaining in queue`;
  $('queue-output').className = `queue-value ${queue.empty ? 'empty' : 'busy'}`;
  $('queue-detail').textContent = queue.empty
    ? ''
    : `${queue.remaining_total || 0} total active item${queue.remaining_total === 1 ? '' : 's'}, ${queue.remaining_playlists || 0} playlist${queue.remaining_playlists === 1 ? '' : 's'}`;
  $('active-count').textContent = `${counts.active_videos || 0}/${counts.max_videos || 0} videos, ${counts.active_playlists || 0}/${counts.max_playlists || 0} playlists`;
  $('recent-count').textContent = `${counts.recent || 0} kept for ${data.result_ttl_seconds || 0}s`;
  renderTable('active', data.active || [], 'No downloads are currently running.');
    renderTable('recent', data.recent || [], 'No recent download results.');
    loadFailures();
    loadSystemStatus();
}

async function loadSystemStatus() { try { const d=(await (await fetch('/api/system/status',{cache:'no-store'})).json()).result; const c=d.cookies,gb=n=>(n/1073741824).toFixed(1); $('system-status').textContent=`Disk: ${gb(d.disk.free_bytes)} GiB free of ${gb(d.disk.total_bytes)} GiB (${d.disk.free_percent}%). Cookies: ${c.present?'file found':'no file'}; ${c.netscape_format?'Netscape format':'invalid/unknown format'}; ${c.count} entries, ${c.youtube_domains.length} YouTube/Google domains, ${c.expired} expired.`; } catch(e){$('system-status').textContent='Status unavailable';} }

async function loadFailures() {
  const box = $('failures');
  try { const data = await (await fetch('/api/media/failures', {cache:'no-store'})).json();
    if (!(data.failures||[]).length) { box.innerHTML='<div class="empty">No failed downloads.</div>'; return; }
    box.innerHTML = `<div class="table"><div class="row head"><div>Video ID</div><div>Reason</div><div>Auth status</div><div>Error / actions</div></div>${data.failures.map(f=>`<div class="row"><div class="id">${esc(f.video_id)}</div><div><span class="status failed">${esc(f.reason)}</span>${f.age_restricted?'<div class="muted">Age restricted</div>':''}</div><div class="muted">${f.authenticated?'Used cookies':'No cookies used'}</div><div><div class="muted">${esc(f.error||'')}</div><div class="links"><button class="retry-download" data-retry="${esc(f.video_id)}">Retry</button>${['age_restricted','login_required'].includes(f.reason)?`<button class="retry-download" data-auth="${esc(f.video_id)}">Retry with cookies</button>`:''}</div></div></div>`).join('')}</div>`;
    box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>retryFailed(b.dataset.retry,false));
    box.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>retryFailed(b.dataset.auth,true));
  } catch(e) { box.innerHTML=`<div class="empty">Failed to load failure history: ${esc(e.message)}</div>`; }
}
async function retryFailed(id, authenticated) { const browser=authenticated?prompt('Browser name (chrome, edge, firefox) or leave blank to use data/cookies.txt:',''):''; const q=authenticated?'?authenticated=1'+(browser?'&browser='+encodeURIComponent(browser):''):''; await fetch('/api/youtube/retry/'+encodeURIComponent(id)+q,{method:'POST'}); loadFailures(); loadStatus(); }

function renderTable(targetId, rows, emptyText) {
  if (!rows.length) {
    $(targetId).innerHTML = `<div class="empty">${esc(emptyText)}</div>`;
    return;
  }
  $(targetId).innerHTML = `<div class="table">
    <div class="row head">
      <div>Type</div><div>ID</div><div>Status</div><div>Time</div><div>Links</div>
    </div>
    ${rows.map(renderRow).join('')}
  </div>`;
}

function renderRow(item) {
  const active = !!item.active;
  const seconds = active ? item.elapsed_seconds : item.age_seconds;
  const timeLabel = active ? `${fmtDuration(seconds)} elapsed` : `${fmtDuration(seconds)} ago`;
  const status = esc(item.status || 'unknown');
  const reason = !active && item.reason ? `<div class="muted">${esc(item.reason)}${item.error ? `: ${esc(item.error)}` : ''}</div>` : '';
  const percent = Number(item.percent);
  const progress = item.active && (item.phase || Number.isFinite(percent))
    ? `<div class="progress-detail">
         <div class="progress-bar"><div class="progress-fill" style="width:${Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : 8}%"></div></div>
         <div class="progress-file">Overall: ${Number.isFinite(percent) ? `${percent}%` : 'working'} · ${item.files_completed || 0} of ${item.files_total || 0} files complete</div>
         ${renderFiles(item.files)}
         ${item.logs?.length ? `<details open><summary class="muted">yt-dlp output (${item.logs.length} lines)</summary><pre class="progress-log">${esc(item.logs.join('\\n'))}</pre></details>` : ''}
       </div>` : '';
  return `<div class="row">
    <div>${esc(item.kind || '')}</div>
    <div class="id">${esc(item.id || '')}</div>
    <div><span class="status ${status}">${status}</span>${reason}</div>
    <div class="muted">${timeLabel}</div>
    <div class="links">${linksFor(item)}</div>${progress}
  </div>`;
}

function renderFiles(files) {
  const rows = Object.values(files || {});
  if (!rows.length) return '';
  return `<div class="file-progress-list">${rows.map(file => {
    const percent = Number(file.percent);
    return `<div class="file-progress-row"><span title="${esc(file.filename || '')}">${esc(file.filename || 'current')}</span><span>${file.status === 'completed' ? '✓' : Number.isFinite(percent) ? `${percent}%` : 'queued'}</span><div class="progress-bar"><div class="progress-fill" style="width:${file.status === 'completed' ? 100 : Number.isFinite(percent) ? Math.max(0, Math.min(100, percent)) : 0}%"></div></div></div>`;
  }).join('')}</div>`;
}

function linksFor(item) {
  const id = encodeURIComponent(item.id || '');
  const youtubeUrl = item.kind === 'playlist'
    ? `https://www.youtube.com/playlist?list=${id}`
    : `https://www.youtube.com/watch?v=${id}`;
  if (item.kind === 'playlist') {
    return `<button class="copy-url" data-copy-url="${youtubeUrl}">Copy YouTube URL</button>`;
  }
  const retry = item.status === 'failed' ? `<button class="retry-download" data-retry-id="${id}">Retry</button>` : '';
  return `<button class="copy-url" data-copy-url="${youtubeUrl}">Copy YouTube URL</button><a href="/?play=${id}">Library</a>${retry}`;
}

document.addEventListener('click', async (event) => {
  const retry = event.target.closest('[data-retry-id]');
  if (retry) {
    retry.disabled = true;
    await fetch(`/api/youtube/retry/${retry.dataset.retryId}`, {method: 'POST'});
    await loadStatus();
    return;
  }
  const button = event.target.closest('[data-copy-url]');
  if (!button) return;
  try {
    await navigator.clipboard.writeText(button.dataset.copyUrl);
    const original = button.textContent;
    button.textContent = 'Copied';
    setTimeout(() => { button.textContent = original; }, 1200);
  } catch {
    button.textContent = 'Copy failed';
  }
});

function fmtDuration(value) {
  const seconds = Math.max(0, Math.floor(Number(value) || 0));
  const minutes = Math.floor(seconds / 60);
  const remaining = seconds % 60;
  if (minutes < 1) return `${remaining}s`;
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  if (hours < 1) return `${minutes}m ${remaining}s`;
  return `${hours}h ${mins}m`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

loadStatus();
timerId = setInterval(loadStatus, 3000);
window.addEventListener('beforeunload', () => clearInterval(timerId));
</script>
</body>
</html>
