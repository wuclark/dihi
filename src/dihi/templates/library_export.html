<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library file export</title>
<style>body{background:#111;color:#eee;font:14px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}a{color:#7cf}.panel{background:#1d1d1d;border:1px solid #444;border-radius:8px;padding:14px;margin:12px 0}.scroll{max-height:650px;overflow:auto}.file{border-top:1px solid #383838;padding:8px 0;overflow-wrap:anywhere}.muted{color:#aaa}</style>
{% include "_header.html" %}<main><h1>Library file export</h1><p class="muted">Every file currently found in the indexed library. Exporting creates links only; it does not copy or delete files.</p><p><a class="panel" href="/api/media/library/files.txt">Download local file links</a> <a class="panel" href="/api/media/library/youtube.txt">Download YouTube links</a> <a class="panel" href="/api/media/library/ids.txt">Download video + playlist IDs</a></p><div id="summary" class="panel">Scanning…</div><div id="files" class="panel scroll"></div></main>
<script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/media/library/files',{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('summary').textContent=`${d.count||0} files`;document.getElementById('files').innerHTML=(d.files||[]).map(f=>`<div class="file"><b>${esc(f.title)}</b> <span class="muted">(${esc(f.video_id)})</span><br><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a><span class="muted"> · ${Math.round((f.size||0)/1024)} KB</span></div>`).join('')||'<span class="muted">No files found.</span>'}).catch(e=>document.getElementById('summary').textContent='Could not load files: '+e.message);</script>
