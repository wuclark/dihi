<!doctype html><meta charset="utf-8"><title>DIHI Status</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:0}header{position:sticky;top:0;background:#222;padding:16px;z-index:2}a{color:#7cf;margin-right:16px}main{padding:24px;max-width:900px}.box{background:#222;border:1px solid #444;border-radius:10px;padding:18px;margin:12px 0}dt{color:#aaa;margin-top:8px}dd{margin:2px 0 0}</style><header><a href="/">DIHI / Search & Download</a><a href="/downloads">Downloads</a><a href="/tools">Tools</a><a href="/status">Status</a><a href="/extension.zip">Edge extension</a></header><main><h1>System status</h1><div id="status" class="box">Checking…</div></main><script>const statusEl=document.getElementById('status');fetch('/api/system/status').then(r=>r.json()).then(d=>{const c=d.cookies;statusEl.innerHTML=`<dl><dt>Disk</dt><dd>${(d.disk.free_bytes/1073741824).toFixed(1)} GiB free of ${(d.disk.total_bytes/1073741824).toFixed(1)} GiB (${d.disk.free_percent}%)</dd><dt>Cookies</dt><dd>${c.present?'Present':'Missing'} · ${c.netscape_format?'Netscape format':'Unknown format'} · ${c.count} entries · ${c.youtube_domains.length} YouTube/Google domains · ${c.expired} expired</dd></dl>`}).catch(()=>statusEl.textContent='Status unavailable')</script>
