<!doctype html><meta charset="utf-8"><title>DIHI Status</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:0}main{padding:24px;max-width:900px}.box{background:#222;border:1px solid #444;border-radius:10px;padding:18px;margin:12px 0}dt{color:#aaa;margin-top:8px}dd{margin:2px 0 0}.dir{display:flex;justify-content:space-between;border-top:1px solid #444;padding:8px 0;gap:10px}.dir:first-child{border-top:0}.path{overflow-wrap:anywhere}</style>{% include "_header.html" %}<main><h1>System status</h1><div id="status" class="box">Checking…</div></main><script>const statusEl=document.getElementById('status'),gb=n=>(n/1073741824).toFixed(2)+' GiB';fetch('/api/system/status').then(r=>r.json()).then(d=>{const c=d.cookies,dirs=Object.entries(d.directories||{}).map(([p,n])=>`<div class="dir"><span class="path">${p}</span><strong>${gb(n)}</strong></div>`).join('');statusEl.innerHTML=`<dl><dt>Disk</dt><dd>${gb(d.disk.free_bytes)} free of ${gb(d.disk.total_bytes)} (${d.disk.free_percent}%)</dd><dt>Media directories</dt><dd>${dirs||'No media directories found.'}</dd><dt>Cookies</dt><dd>${c.present?'Present':'Missing'} · ${c.netscape_format?'Netscape format':'Unknown format'} · ${c.count} entries · ${c.youtube_domains.length} YouTube/Google domains · ${c.expired} expired</dd></dl>`}).catch(()=>statusEl.textContent='Status unavailable')</script>
