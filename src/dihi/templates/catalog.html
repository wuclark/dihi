<!doctype html><html><head><meta charset="utf-8"><title>DIHI Catalog</title><style>body{background:#111;color:#eee;font:14px system-ui}header{padding:15px;background:#222;display:flex;gap:15px}a{color:#6cf}main{padding:20px;overflow:auto}.table{min-width:1100px}.row{display:grid;grid-template-columns:70px 110px 240px 150px 90px 90px 100px 1fr;gap:8px;padding:8px;border-top:1px solid #333}.head{background:#333}.thumb{width:64px;height:40px;object-fit:cover}.yes{color:#5d7}.no,.missing{color:#f77}.retry{color:#fc6;background:none;border:0;cursor:pointer}.play{display:block}.muted{color:#aaa;font-size:12px}</style></head><body><header><a href="/">DIHI</a><a href="/downloads">Downloads</a><a href="/tags">Tags</a><span>Sort <select id="sort"><option value="date-desc">Newest</option><option value="date-asc">Oldest</option><option value="artist">Artist</option><option value="title">Title</option></select></span></header><main><div id="summary">Loading…</div><div id="table"></div><button id="prev">Previous</button> <span id="page"></span> <button id="next">Next</button></main><script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=1,pages=1;
function formats(files,list,id){const vals=Object.values(files||{}),got=new Set(vals.map(x=>String(x.format_id||'')).filter(Boolean)),downloaded=new Set(vals.flatMap(x=>{const m=String(x.name||'').match(/\.out\.f(\d+)\./);return m?[m[1]]:[]})),off=new Map((list||[]).map(x=>[String(x.format_id),x]));const rows=['399','251','140'].map(fid=>{const f=off.get(fid),d=f?`${f.height?f.height+'p ':''}${f.ext||''}${f.vcodec&&f.vcodec!=='none'?' '+f.vcodec:''}`:'not offered',ok=got.has(fid)||downloaded.has(fid),r=f&&!ok?` <button class="retry" data-retry="${esc(id)}">Retry</button>`:'';return `<div class="${f?'yes':'no'}">${fid}: ${f?'available':'missing'} (${d})${ok?' · downloaded':''}${r}</div>`});const fallback=[...downloaded].filter(fid=>!['399','251','140'].includes(fid));if(fallback.length) rows.push(`<div class="muted">Fallback downloaded: ${fallback.join(', ')}</div>`);return rows.join('')+`<div>${[...new Set(vals.map(x=>x.subtitle_language).filter(Boolean))].join(', ')||'no downloaded subtitles'}</div>`}
async function load(){const r=await fetch(`/api/media/catalog?page=${page}&per_page=50&sort=${$('sort').value}`);if(!r.ok){$('summary').textContent='Catalog is still being built';return}const d=await r.json();pages=d.pages||1;$('summary').textContent=`${d.total} videos`;$('page').textContent=`${page}/${pages}`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('table').innerHTML=`<div class="row head"><div>Thumb</div><div>ID</div><div>Title / play</div><div>Artist</div><div>Date</div><div>Source</div><div>Album</div><div>Requested formats / missing</div></div>${d.items.map(v=>{const t=Object.values(v.files||{}).find(x=>x.kind==='thumbnail'),p=Object.values(v.files||{}).find(x=>x.kind==='video'||x.kind==='audio');return `<div class="row"><div>${t?`<img class="thumb" src="${esc(t.url)}">`:''}</div><div>${esc(v.video_id)}</div><div>${esc(v.title)}${p?`<a class="play" href="/?play=${encodeURIComponent(v.video_id)}&autoplay=1">Play local</a>`:'<span class="missing play">Missing playable file</span>'}</div><div>${esc(v.artist)}<br><span class="muted">${esc(v.uploader)}</span></div><div>${esc(v.upload_date||'')}</div><div>${esc(v.source_root)}</div><div>${esc(v.album)}</div><div>${formats(v.files,v.formats,v.video_id)}</div></div>`}).join('')}</div>`}
sort.onchange=()=>{page=1;load()};prev.onclick=()=>{if(page>1){page--;load()}};next.onclick=()=>{if(page<pages){page++;load()}};table.onclick=async e=>{const b=e.target.closest('[data-retry]');if(!b)return;b.disabled=true;b.textContent='Retrying…';await fetch(`/api/youtube/retry/${b.dataset.retry}`,{method:'POST'});b.textContent='Queued'};load();</script></body></html>
