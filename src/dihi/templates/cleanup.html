<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIHI Cleanup Report</title>
<style>body{background:#111;color:#eee;font:14px system-ui;margin:0}main{max-width:1400px;margin:auto;padding:24px}a{color:#7cf}.panel{background:#1d1d1d;border:1px solid #444;border-radius:8px;padding:16px;margin:14px 0}.summary{font-size:1.2rem}.muted{color:#aaa}.cleanup-table{width:100%;border-collapse:collapse;min-width:900px}.cleanup-table th,.cleanup-table td{border:1px solid #383838;padding:9px;text-align:left;vertical-align:top}.cleanup-table th{background:#292929}.cleanup-table td:first-child{color:#7cf;white-space:nowrap}.cleanup-table details summary{cursor:pointer}.yes{color:#5d7}.no{color:#f77}.unknown{color:#fc6}.duplicate{color:#aaa}.cell-detail{margin-top:8px;border-top:1px solid #383838;padding-top:7px;overflow-wrap:anywhere}.report-scroll{overflow:auto}@media(max-width:700px){.cleanup-table{min-width:760px}}</style>
{% include "_header.html" %}<main><h1>Cleanup report</h1><p class="muted">Dry run only. Nothing is deleted.</p><div id="summary" class="panel">Scanning…<div class="progress"><i></i></div></div><div id="list" class="panel"></div></main><style>.video-group{border-top:1px solid #383838;padding:10px 0}.video-group summary{cursor:pointer;display:grid;grid-template-columns:180px 100px 1fr;gap:12px;align-items:center}.id{color:#7cf}.check{font-weight:700}.check.yes{color:#5d7}.check.no{color:#f77}.check.unknown{color:#fc6}.details{padding:8px 0 0 20px}.detail{display:grid;grid-template-columns:170px 1fr 260px;gap:10px;border-top:1px solid #303030;padding:8px 0}.detail span{overflow-wrap:anywhere}.progress{height:8px;background:#333;border-radius:5px;overflow:hidden;margin-top:10px}.progress i{display:block;width:35%;height:100%;background:#3ea6ff;animation:scan 1.2s ease-in-out infinite}@keyframes scan{0%{margin-left:-35%}100%{margin-left:100%}}.progress.done i{width:100%;margin-left:0;animation:none;background:#2ea043}@media(max-width:700px){.video-group summary,.detail{grid-template-columns:1fr}}</style>
<script>
'use strict';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const size=n=>{const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return `${n.toFixed(i?2:0)} ${u[i]}`};
fetch('/api/media/cleanup-report').then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
  const groups={};
  for(const x of d.entries||[]){const g=groups[x.video_id]??={entries:[],audio:[],kept:[]};g.entries.push(x);for(const p of x.primary_files||[])if(!g.kept.some(k=>k.path===p.path))g.kept.push(p)}
  for(const x of d.audio_checks||[])(groups[x.video_id]??={entries:[],audio:[]}).audio.push(x);
  for(const x of d.location_checks||[]){const g=groups[x.video_id]??={entries:[],audio:[],locations:[]};(g.locations??=[]).push(x)}
  for(const [id,files] of Object.entries(d.inventory||{}))(groups[id]??={entries:[],audio:[]}).inventory=files;
  for(const [id,missing] of Object.entries(d.missing_expected||{})){const g=groups[id]??={entries:[],audio:[]};g.missing=missing}
  for(const [path,result] of Object.entries(d.full_checks||{})){const file=Object.values(d.inventory||{}).flat().find(x=>x.path===path);if(file){const g=groups[file.video_id]??={entries:[],audio:[]};(g.full??=[]).push({...result,...file})}}
  const columns=['primary location','missing expected files','kept primary files','fallback duplicate','raw format sidecar','optional clean duplicate','audio integrity','full verify','files to delete'];
  const status=g=>{const checks=g.map(x=>x.recoverability?.status||x.status).filter(Boolean);if(checks.includes('yes'))return ['✓','yes'];if(checks.includes('unknown'))return ['?','unknown'];if(checks.includes('no'))return ['✕','no'];return ['—','duplicate'];};
  const cell=(items,kind)=>{if(!items.length)return '<span class="muted">—</span>';const [icon,rawLabel]=status(items),label=kind==='kept primary files'?'kept':rawLabel,shownIcon=kind==='kept primary files'?'✓':icon,total=items.reduce((n,x)=>n+(x.bytes||0),0);return `<details><summary class="${label}">${shownIcon} ${label} · ${items.length} · ${size(total)}</summary>${items.map(x=>{const c=x.recoverability,reason=c?`Check: ${c.status} — ${c.reason}`:x.reason,file=x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Open file</a>`:'',primary=(x.primary_files||[]).map(p=>`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>`).join(', ');return `<div class="cell-detail"><div>${file} <span class="muted">${esc(x.path)}</span></div><span class="muted">${esc(x.location||'')}</span><span class="muted">${esc(reason||'')}</span>${primary?`<div>Primary replacement: ${primary}</div>`:''}</div>`}).join('')}</details>`};
  const locationCell=g=>{const checks=g.locations||[],check=checks[0];if(check){const c=check.comparison,compare=c?`<div class="cell-detail"><b>Matching: ${c.matches.length}</b><br><b>Different: ${c.different.length}</b>${c.different.map(x=>`<div class="cell-detail no">${esc(x.name)}<br>legacy: ${esc(x.source)}<br>primary: ${esc(x.target)}</div>`).join('')}<br><b>Legacy only: ${c.legacy_only.length}</b>${c.legacy_only.map(x=>`<div class="cell-detail unknown">${esc(x)}</div>`).join('')}${c.matches.length?`<br><button data-reconcile="${esc(check.video_id)}">Delete matching legacy files</button>`:''}${c.different.length?`<br><button data-different="${esc(check.video_id)}">Delete differing legacy files</button>`:''}${c.legacy_only.length?`<br><button data-legacy-only="${esc(check.video_id)}">Move legacy-only files</button>`:''}${c.empty?`<br><button data-empty="${esc(check.video_id)}">Delete empty legacy directories</button>`:''}</div>`:'';return `<span class="${check.status==='movable'?'unknown':check.status==='conflict'?'no':'yes'}">${check.status==='movable'?'⇢ movable':check.status==='conflict'?'✕ conflict':'✓ default'}</span><br><span class="muted">${esc(check.reason)}</span><details><summary>paths / compare</summary><div class="cell-detail">from: ${esc(check.source)}<br>to: ${esc(check.target)}${check.status==='movable'?`<br><button data-move="${esc(check.video_id)}">Move to default</button>`:''}${check.empty?`<br><button data-empty="${esc(check.video_id)}">Delete empty legacy directories</button>`:''}${compare}</div></details>`}const locations=[...new Set((g.kept||[]).map(x=>x.location).filter(Boolean))];if(!locations.length)return '<span class="muted">?</span>';const primary=locations.some(x=>x.startsWith('primary merged/'));return `<span class="${primary?'yes':'unknown'}">${primary?'✓ default merged/':'? legacy location'}</span><br><span class="muted">${esc(locations.join(', '))}</span>`};
  const inventoryCell=g=>{const files=g.inventory||[];if(!files.length)return '<span class="muted">—</span>';return `<details><summary>${files.length} files</summary>${files.map(x=>`<div class="cell-detail ${x.status==='delete'?'no':'yes'}">${x.status==='delete'?'✕ delete':'✓ keep'} <a href="${esc(x.url)}" target="_blank" rel="noopener">Open file</a><br><span class="muted">${esc(x.path)} · ${size(x.bytes)}</span></div>`).join('')}</details>`};
  const missingCell=g=>{const missing=g.missing||[];return missing.length?`<details><summary class="no">✕ ${missing.length} missing</summary>${missing.map(x=>`<div class="cell-detail no">${esc(x)}</div>`).join('')}</details>`:'<span class="yes">✓ complete</span>'};
  const deleteCell=items=>{if(!items.length)return '<span class="muted">—</span>';const total=items.reduce((n,x)=>n+x.bytes,0);return `<details><summary class="no">✕ ${items.length} files · ${size(total)}</summary>${items.map(x=>`<div class="cell-detail no"><a href="${esc(x.url)}" target="_blank" rel="noopener">Open file</a> <button data-delete="${esc(x.path)}">Delete</button><br><span class="muted">${esc(x.path)} · ${size(x.bytes)}</span></div>`).join('')}</details>`};
  document.getElementById('summary').innerHTML=`<div class="summary">${Object.keys(groups).length} videos · ${d.count} candidate files · <strong>${size(d.bytes)}</strong> possible savings <button id="full-verify">Full verify all</button> <button id="retry-missing">Retry missing downloads</button> <button id="move-all">Move all movable legacy</button> <button id="delete-different-all">Delete all differing legacy files</button> <button id="delete-empty-all">Delete empty legacy directories</button> <button id="delete-all">Delete all listed files</button></div><p class="muted">Each column is a separate check/category. Full verify reads each media file once and reuses the result while its MD5 is unchanged. Retry missing skips complete media and permanent failures such as private/unavailable videos. Grey “duplicate” means the file is an extra copy, not that it is broken. Move legacy folders only when marked movable. Empty legacy directories contain no files; cleanup removes only empty video folders and empty channel parents. Expand a cell for exact paths, links, and reasons.</p>`;
  const rows=Object.entries(groups).map(([id,g])=>`<tr><td><span class="id">${esc(id)}</span>${inventoryCell(g)}</td>${columns.map(kind=>`<td>${kind==='primary location'?locationCell(g):kind==='missing expected files'?missingCell(g):kind==='files to delete'?deleteCell(g.entries||[]):cell(kind==='audio integrity'?(g.audio||[]):kind==='kept primary files'?(g.kept||[]):kind==='full verify'?(g.full||[]):(g.entries||[]).filter(x=>x.category===kind),kind)}</td>`).join('')}</tr>`).join('');
  document.getElementById('list').innerHTML=`<div class="report-scroll"><table class="cleanup-table"><thead><tr><th>YouTube ID / all files</th>${columns.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="10">No cleanup candidates found.</td></tr>'}</tbody></table></div>`;
  const watch=async(taskId,button,bar)=>{button.disabled=true;if(!bar){bar=document.createElement('div');bar.className='progress';bar.innerHTML='<i></i>';document.getElementById('summary').appendChild(bar)}let task;do{await new Promise(r=>setTimeout(r,500));const r=await fetch('/api/media/cleanup/tasks/'+encodeURIComponent(taskId));task=await r.json();const pct=task.total?Math.round((task.processed||0)*100/task.total):0;bar.querySelector('i').style.width=pct+'%';bar.querySelector('i').style.marginLeft='0';button.textContent=task.status==='running'?`${task.phase} ${task.processed||0}/${task.total||'…'}`:task.status==='completed'?'Done':'Failed'}while(task.status==='running');if(task.status==='failed')alert(task.error||'Cleanup task failed');else{bar.classList.add('done');const result=task.moved!==undefined?`${task.moved} folder${task.moved===1?'':'s'} moved`:task.deleted!==undefined?`${task.deleted} file${task.deleted===1?'':'s'} deleted`:task.removed!==undefined?`${task.removed} files deleted`:`${task.processed||0} files verified`;const toast=document.createElement('div');toast.textContent=`Finished: ${result}`;toast.style='position:fixed;right:20px;bottom:20px;background:#238636;color:#fff;padding:14px 18px;border-radius:8px;z-index:9999';document.body.appendChild(toast);setTimeout(()=>location.reload(),1400)}};
  document.getElementById('list').addEventListener('click',async e=>{const del=e.target.closest('[data-delete]'),move=e.target.closest('[data-move]'),rec=e.target.closest('[data-reconcile]'),diff=e.target.closest('[data-different]'),only=e.target.closest('[data-legacy-only]'),empty=e.target.closest('[data-empty]');if(!del&&!move&&!rec&&!diff&&!only&&!empty)return;if(!confirm(del?'Delete this file permanently?':rec?'Delete only legacy files whose MD5 matches the primary copy?':diff?'Delete legacy files with different contents from primary?':only?'Move legacy-only files without overwriting primary files?':empty?'Delete this empty legacy folder and any empty parent directory?':'Move this legacy folder to merged/?'))return;const action=rec?'reconcile':diff?'different':only?'legacyOnly':empty?'empty':'move',url={reconcile:'/api/media/cleanup/delete-legacy-matches',different:'/api/media/cleanup/delete-legacy-different',legacyOnly:'/api/media/cleanup/move-legacy-only',empty:'/api/media/cleanup/delete-empty-legacy',move:'/api/media/cleanup/move-legacy',delete:'/api/media/cleanup/delete'}[action],body=action==='delete'?{path:del.dataset.delete}:{video_id:rec?rec.dataset.reconcile:diff?diff.dataset.different:only?only.dataset.legacyOnly:empty?empty.dataset.empty:move.dataset.move};const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok){alert(data.error||'Action failed');return}watch(data.task_id,e.target)});
  document.getElementById('full-verify').addEventListener('click',async()=>{const button=document.getElementById('full-verify');button.disabled=true;button.textContent='Starting…';const r=await fetch('/api/media/cleanup/verify',{method:'POST'});const data=await r.json();if(!r.ok){alert(data.error||'Verification failed');button.disabled=false;return}watch(data.task_id,button)});
  document.getElementById('retry-missing').addEventListener('click',async()=>{const button=document.getElementById('retry-missing');button.disabled=true;button.textContent='Checking…';const r=await fetch('/api/media/cleanup/retry-missing',{method:'POST'});const data=await r.json();button.textContent=r.ok?`Queued ${data.queued} (${data.skipped_permanent} skipped)`:'Retry failed';if(!r.ok)button.disabled=false});
  document.getElementById('move-all').addEventListener('click',async()=>{if(!confirm('Move every legacy folder currently marked movable to merged/?'))return;const button=document.getElementById('move-all');button.disabled=true;button.textContent='Starting…';const bar=document.createElement('div');bar.className='progress';bar.innerHTML='<i></i>';document.getElementById('summary').appendChild(bar);const r=await fetch('/api/media/cleanup/move-legacy-all',{method:'POST'});const data=await r.json();if(!r.ok){alert(data.error||'Bulk move failed');button.disabled=false;bar.remove();return}watch(data.task_id,button,bar)});
  const bulkCleanup=(id,url,message)=>document.getElementById(id).addEventListener('click',async()=>{if(!confirm(message))return;const button=document.getElementById(id);button.disabled=true;button.textContent='Starting…';const r=await fetch(url,{method:'POST'});const data=await r.json();if(!r.ok){alert(data.error||'Cleanup failed');button.disabled=false;return}watch(data.task_id,button)});
  bulkCleanup('delete-different-all','/api/media/cleanup/delete-legacy-different-all','Delete every legacy file whose contents differ from the primary copy?');
  bulkCleanup('delete-empty-all','/api/media/cleanup/delete-empty-legacy-all','Delete all empty legacy video folders and empty channel parents?');
  document.getElementById('delete-all').addEventListener('click',async()=>{if(!confirm('Delete every file currently listed as safe to delete?'))return;const button=document.getElementById('delete-all');button.disabled=true;button.textContent='Starting…';const r=await fetch('/api/media/cleanup/delete-all',{method:'POST'});const data=await r.json();if(!r.ok){alert(data.error||'Bulk delete failed');button.disabled=false;return}watch(data.task_id,button)});
}).catch(e=>document.getElementById('summary').textContent='Could not create report: '+e.message);
</script>
