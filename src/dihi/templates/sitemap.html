<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIHI Site map</title>
<style>body{background:#0f0f0f;color:#eee;font:15px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}.group{background:#1b1b1b;border:1px solid #444;border-radius:9px;padding:16px;margin:14px 0}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}a{color:#7cf}.muted{color:#aaa}</style>
{% include "_header.html" %}<main><h1>Site map</h1><p class="muted">All primary DIHI pages and tools.</p>{% for name, links in groups %}<section class="group"><h2>{{ name }}</h2><div class="links">{% for label, href in links %}<a href="{{ href }}">{{ label }}</a>{% endfor %}</div></section>{% endfor %}</main>
