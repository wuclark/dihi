<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIHI Video</title>
<style>body{background:#0f0f0f;color:#eee;font:15px system-ui;margin:0}main{max-width:1100px;margin:auto;padding:24px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:9px;padding:18px;margin:14px 0}video,audio{width:100%;max-height:65vh}a{color:#7cf}.muted{color:#aaa}.error{color:#f77}pre{white-space:pre-wrap;max-height:450px;overflow:auto;background:#111;padding:12px;border-radius:6px}.links,.file-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.file{border-top:1px solid #383838;padding:9px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.kind{color:#fc6;font-size:12px;text-transform:uppercase}.size{color:#aaa;font-size:12px}dl{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:7px 14px}dt{color:#aaa}dd{margin:0;overflow-wrap:anywhere}</style>
{% include "_header.html" %}<main><div id="content" class="panel">Loading video…</div></main>
<script>
'use strict';const id={{ video_id|tojson }},box=document.getElementById('content'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pretty=x=>typeof x==='object'?JSON.stringify(x,null,2):String(x??''),bytes=n=>{n=Number(n||0);if(!n)return '';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`};
function metadata(info){const preferred=['title','channel','channel_id','uploader','uploader_id','upload_date','timestamp','duration','view_count','like_count','categories','tags','webpage_url'];const keys=[...preferred,...Object.keys(info||{}).filter(k=>!preferred.includes(k)&&!k.startsWith('_'))];return keys.filter(k=>info[k]!==undefined&&info[k]!==null&&info[k]!=='').map(k=>`<dt>${esc(k)}</dt><dd>${esc(pretty(info[k]))}</dd>`).join('')}
async function load(){try{const r=await fetch('/api/media/resolve/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json(),v=d.video||d,media=v.player_url,details=v.details||{},meta=details.metadata||{},info=meta.info_json||{},files=details.files||[];if(!media&&!files.length)throw new Error('No saved video details found');const player=media?(d.player_kind==='audio'?`<audio controls autoplay src="${esc(media)}"></audio>`:`<video controls autoplay playsinline src="${esc(media)}"></video>`):'<p class="muted">No playable local media file</p>';const playable=[['video',v.files?.video],['audio',v.files?.audio]].filter(x=>x[1]);const fileRows=files.map(f=>`<div class="file"><span class="kind">${esc(f.kind)}</span>${f.url?`<a href="${esc(f.url)}">${esc(f.name)}</a>`:esc(f.name)}<span class="size">${bytes(f.size)}</span></div>`).join('');box.innerHTML=`<h1>${esc(info.title||v.title||id)}</h1><div class="muted">📅 ${esc(info.upload_date||v.date||'')}<br>📁 ${esc(info.channel_id||v.channel_id||'')}<br>🔗 ${esc(id)}</div>${player}<div class="links">${playable.map(([kind,url])=>`<a href="${esc(url)}">${kind==='video'?'▶ Video':'♫ Audio only'}</a>`).join('')}<a href="/">✕ Close</a></div>${media?`<p>Open in VLC:<br><a href="${esc(location.origin+media)}">${esc(location.origin+media)}</a></p>`:''}${meta.description?`<details><summary>Description (open)</summary><pre>${esc(meta.description)}</pre></details>`:''}<h2>Files (${files.length})</h2>${fileRows||'<p class="muted">No files indexed.</p>'}<h2>Metadata</h2><dl>${metadata(info)}</dl>`}catch(e){box.innerHTML=`<div class="error">Could not load video: ${esc(e.message)}</div>`}}load();
</script>
