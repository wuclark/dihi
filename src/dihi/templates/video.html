<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIHI Video</title>
<style>body{background:#0f0f0f;color:#eee;font:15px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:9px;padding:18px;margin:14px 0}video,audio{width:100%;max-height:65vh}a{color:#7cf}.muted{color:#aaa}pre{white-space:pre-wrap;max-height:400px;overflow:auto}.error{color:#f77}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}</style>
{% include "_header.html" %}<main><div id="content" class="panel">Loading video…</div></main>
<script>
'use strict';const id={{ video_id|tojson }},box=document.getElementById('content'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/media/resolve/'+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json(),v=d.video||d,media=v.player_url,meta=v.details?.metadata||{};if(!media)throw new Error('No playable local media found');const player=v.player_kind==='audio'?`<audio controls autoplay src="${esc(media)}"></audio>`:`<video controls autoplay playsinline src="${esc(media)}"></video>`;box.innerHTML=`<h1>${esc(v.title||id)}</h1>${player}<div class="links"><a href="${esc(media)}">Open media file</a><a href="${esc(location.origin+media)}">Copy VLC URL</a><a href="/">Library</a></div>${meta.description?`<h2>Description</h2><pre>${esc(meta.description)}</pre>`:''}<h2>Metadata</h2><p class="muted">Video ID: ${esc(id)} · Channel: ${esc(v.channel_id||'')}</p>`}catch(e){box.innerHTML=`<div class="error">Could not load video: ${esc(e.message)}</div>`}}load();
</script>
