<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIHI API documentation</title>
<style>body{background:#0f0f0f;color:#eee;font:14px system-ui;margin:0}main{max-width:1200px;margin:auto;padding:24px}.group{margin:18px 0;background:#1b1b1b;border:1px solid #444;border-radius:9px;overflow:auto}h1{margin-top:0}.row{display:grid;grid-template-columns:80px minmax(280px,1fr) 1fr;gap:14px;padding:10px 14px;border-top:1px solid #333;min-width:650px}.row:first-child{border-top:0}.head{background:#292929;color:#aaa;font-size:12px;text-transform:uppercase}.method{color:#7cf;font-weight:700}.path{font-family:ui-monospace,monospace;overflow-wrap:anywhere}.muted{color:#aaa}</style>
{% include "_header.html" %}<main><h1>API documentation</h1><p class="muted">Available HTTP endpoints for the DIHI site, queue, media catalog, and browser extension.</p><div class="group"><div class="row head"><div>Method</div><div>Path</div><div>Purpose</div></div>
{% for method, path, purpose in endpoints %}<div class="row"><div class="method">{{ method }}</div><div class="path">{{ path }}</div><div>{{ purpose }}</div></div>{% endfor %}</div></main>
