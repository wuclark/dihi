<!doctype html><meta charset="utf-8"><title>DIHI Tag Cloud</title>
<style>body{background:#111;color:#eee;font:15px system-ui;margin:0}header{padding:16px;background:#222}a{color:#7cf;margin-right:16px}main{padding:24px}.cloud{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:30px 10px}.tag{color:hsl(var(--h),75%,65%);font-size:calc(12px + var(--s)*1px)}</style>
<header><a href="/">DIHI / Search & Download</a><a href="/downloads">Downloads</a><a href="/tools">Tools</a><a href="/status">Status</a><a href="/catalog">Catalog</a><a href="/tags">Tags</a><a href="/wordcloud">Lyrics word cloud</a><a href="/extension.zip">Edge extension</a></header>
<main><h1>Tag cloud</h1><p>Tags collected from saved video metadata. Click a tag to browse matching videos.</p><div id="cloud" class="cloud">Loading…</div></main>
<script>fetch('/api/media/tags').then(r=>r.json()).then(d=>{const a=d.tags||[],m=a[0]?.count||1;cloud.innerHTML=a.length?a.map((x,i)=>`<a class="tag" href="/tags?tag=${encodeURIComponent(x.tag)}" style="--s:${Math.round(10+22*x.count/m)};--h:${(i*47)%360}" title="${x.count} videos">${x.tag}</a>`).join(''):'No tags found.'}).catch(()=>cloud.textContent='Could not load tags.')</script>
