<!doctype html><meta charset="utf-8"><title>DIHI Tag Cloud</title>
<style>body{background:#0f0f0f;color:#eee;font:15px system-ui;margin:0}main{padding:24px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:12px;max-width:1100px}.cloud{width:100%;height:650px;background:#151515;border-radius:8px}.tag-word{cursor:pointer;font-weight:600}.tag-word:hover{opacity:.7}</style>
{% include "_header.html" %}
<main><h1>Tag cloud</h1><p>Tags collected from saved video metadata. Click a tag to browse matching videos.</p><div class="panel"><svg id="cloud" class="cloud" viewBox="0 0 1100 650" role="img" aria-label="Tag cloud"></svg></div></main>
<script src="/static/js/d3.min.js"></script><script src="/static/js/d3.layout.cloud.js"></script><script>
fetch('/api/media/tags').then(r=>r.json()).then(d=>{const tags=(d.tags||[]).slice(0,180),max=tags[0]?.count||1;if(!tags.length){cloud.outerHTML='<div>No tags found.</div>';return}const layout=d3.layout.cloud().size([1100,650]).words(tags.map(x=>({...x,size:Math.max(14,Math.min(72,14+58*x.count/max))}))).padding(4).rotate(()=>Math.random()>.85?90:0).font('system-ui').fontSize(x=>x.size).on('end',draw);layout.start();function draw(words){const s=d3.select('#cloud').html('').append('g').attr('transform','translate(550,325)');s.selectAll('text').data(words).join('text').attr('class','tag-word').attr('text-anchor','middle').attr('transform',x=>`translate(${x.x},${x.y}) rotate(${x.rotate})`).style('font-size',x=>x.size+'px').style('fill',(x,i)=>d3.interpolateTurbo(i/Math.max(1,words.length-1))).text(x=>x.tag).on('click',(_,x)=>{location.href='/tags?tag='+encodeURIComponent(x.tag)}).append('title').text(x=>`${x.tag}: ${x.count} videos`)}}).catch(()=>cloud.outerHTML='<div>Could not load tags.</div>');
</script>
