<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIHI Lyrics Word Cloud</title>
<style>
body{background:#0f0f0f;color:#eee;font:15px system-ui;margin:0}main{padding:24px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:12px;max-width:1100px}input,button{padding:8px;margin:4px;background:#222;color:#eee;border:1px solid #555;border-radius:5px}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}svg{width:100%;height:650px;background:#151515;border-radius:8px}.word{cursor:pointer;font-weight:600}.word:hover{opacity:.7}.status{min-height:28px;color:#aaa;padding:8px 4px}.status.error{color:#f77}.status.ready{color:#5d7}.spinner{display:inline-block;width:15px;height:15px;border:3px solid #555;border-top-color:#7cf;border-radius:50%;vertical-align:-3px;margin-right:7px;animation:spin .8s linear infinite}.progress{height:5px;background:#292929;border-radius:5px;overflow:hidden;margin:3px 4px 8px}.progress i{display:block;width:35%;height:100%;background:#7cf;animation:slide 1.1s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
</style>
{% include "_header.html" %}
<main><h1>Lyrics word cloud</h1><div class="panel"><input id="tag" placeholder="Tag (optional)"><input id="playlist" placeholder="Playlist (optional)"><button id="build" type="button">Generate word cloud</button><div id="status" class="status" aria-live="polite">Choose filters, then generate the cloud.</div><div id="progress" class="progress" hidden><i></i></div><svg id="cloud" viewBox="0 0 1100 650" aria-label="Generated word cloud"></svg></div></main>
<script src="/static/js/d3.min.js"></script><script src="/static/js/d3.layout.cloud.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), status=$('status'), progress=$('progress'), build=$('build');
async function load(){
  build.disabled=true; progress.hidden=false; status.className='status'; status.innerHTML='<span class="spinner"></span>Reading descriptions and generating word frequencies…';
  $('cloud').innerHTML='';
  try {
    const q=new URLSearchParams(); if($('tag').value.trim())q.set('tag',$('tag').value.trim()); if($('playlist').value.trim())q.set('playlist',$('playlist').value.trim());
    const response=await fetch('/api/media/wordcloud?'+q,{cache:'no-store'}); if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const words=(await response.json()).words||[]; if(!words.length){status.textContent='No matching words found.';status.className='status ready';return;}
    status.innerHTML='<span class="spinner"></span>Arranging words…';
    const max=words[0]?.count||1;
    d3.layout.cloud().size([1100,650]).words(words.slice(0,150).map(x=>({...x,size:Math.max(14,Math.min(72,14+58*x.count/max))}))).padding(4).rotate(()=>Math.random()>.85?90:0).font('system-ui').fontSize(x=>x.size).on('end',draw).start();
    function draw(data){const s=d3.select('#cloud').html('').append('g').attr('transform','translate(550,325)');s.selectAll('text').data(data).join('text').attr('class','word').attr('text-anchor','middle').attr('transform',d=>`translate(${d.x},${d.y}) rotate(${d.rotate})`).style('font-size',d=>d.size+'px').style('fill',(d,i)=>d3.interpolateTurbo(i/Math.max(1,data.length-1))).text(d=>d.word).on('click',(_,d)=>{location.href='/?word='+encodeURIComponent(d.word)}).append('title').text(d=>`${d.word}: ${d.count} videos — click to browse`);status.textContent=`Generated ${data.length} words.`;status.className='status ready';}
  } catch(error) { status.textContent=`Could not generate word cloud: ${error.message}`; status.className='status error'; }
  finally { build.disabled=false; progress.hidden=true; }
}
build.onclick=load;
</script>
