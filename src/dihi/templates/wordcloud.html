<!doctype html><meta charset="utf-8"><title>DIHI Lyrics Word Cloud</title>
<style>body{background:#111;color:#eee;font:15px system-ui;margin:0}header{padding:16px;background:#222}a{color:#7cf;margin-right:16px}main{padding:24px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:12px;max-width:1100px}input,button{padding:8px;margin:4px;background:#222;color:#eee;border:1px solid #555;border-radius:5px}svg{width:100%;height:650px;background:#151515;border-radius:8px}.word{cursor:pointer;font-weight:600}.word:hover{opacity:.7}</style>
<header><a href="/">DIHI / Search & Download</a><a href="/downloads">Downloads</a><a href="/tools">Tools</a><a href="/status">Status</a><a href="/catalog">Catalog</a><a href="/tags">Tags</a><a href="/tagcloud">Tag cloud</a><a href="/extension.zip">Edge extension</a></header>
<main><h1>Lyrics word cloud</h1><div class="panel"><input id="tag" placeholder="Tag (optional)"><input id="playlist" placeholder="Playlist (optional)"><button id="build">Build</button><svg id="cloud" viewBox="0 0 1100 650"></svg></div></main>
<script src="/static/js/d3.min.js"></script><script src="/static/js/d3.layout.cloud.js"></script><script>
async function load(){const q=new URLSearchParams();if(tag.value.trim())q.set('tag',tag.value.trim());if(playlist.value.trim())q.set('playlist',playlist.value.trim());const d=await (await fetch('/api/media/wordcloud?'+q)).json(),words=(d.words||[]).slice(0,150),max=words[0]?.count||1;const layout=d3.layout.cloud().size([1100,650]).words(words.map(x=>({...x,size:Math.max(14,Math.min(72,14+58*x.count/max))}))).padding(4).rotate(()=>Math.random()>.85?90:0).font('system-ui').fontSize(x=>x.size).on('end',draw);layout.start();function draw(data){const s=d3.select('#cloud').html('').append('g').attr('transform','translate(550,325)');s.selectAll('text').data(data).join('text').attr('class','word').attr('text-anchor','middle').attr('transform',d=>`translate(${d.x},${d.y}) rotate(${d.rotate})`).style('font-size',d=>d.size+'px').style('fill',(d,i)=>d3.interpolateTurbo(i/Math.max(1,data.length-1))).text(d=>d.word).append('title').text(d=>`${d.word}: ${d.count}`)}}build.onclick=load;load();
</script>
