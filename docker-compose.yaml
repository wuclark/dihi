services:
  dihi:
    build: .
    container_name: dihi
    depends_on:
      - bgutil-provider
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Persistent data
      # Note: host files must exist before `docker compose up` or Docker will
      # create them as directories. Run `make data` to initialise them.
      - ./data/archive.txt:/app/archive.txt
      - ./data/cookies.txt:/app/cookies.txt
      - ./data/merged:/app/merged
      - ./data/bestfallback:/app/data/bestfallback
    environment:
      - PORT=5000
      # App container reaches the provider by Compose service name; host CLI uses loopback.
      - DIHI_PO_TOKEN_PROVIDER_URL=http://bgutil-provider:4416
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bgutil-provider:
    # Generate per-video GVS PO Tokens for yt-dlp's mweb client.
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
    init: true
    ports:
      # Keep the unauthenticated provider endpoint off external interfaces.
      - "127.0.0.1:4416:4416"

  # Optional: Redis for persistent rate limiting
  # Uncomment and update app to use redis:// storage_uri
  # redis:
  #   image: redis:alpine
  #   container_name: dihi-redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data

